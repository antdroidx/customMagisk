name: Build ARMSX2 128MB Universal Android APK

on:
  push:
    branches:
      - armsx2-128mb-build
    paths:
      - '.github/workflows/build-armsx2-128mb-universal.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3 openjdk-17-jdk ninja-build

      - name: Prepare Android SDK and debug keystore
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" || true
          fi
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clone ARMSX2
        run: |
          git clone https://github.com/ARMSX2/ARMSX2.git ARMSX2
          cd ARMSX2
          git rev-parse HEAD | tee ../ARMSX2_HEAD.txt

      - name: Populate shaderc third-party dependencies
        run: |
          set -euxo pipefail
          cd ARMSX2/platforms/android/app/src/main/cpp/3rdparty/shaderc/third_party

          fetch_dep() {
            local url="$1"
            local rev="$2"
            local dir="$3"
            rm -rf "$dir"
            git clone --depth 1 --filter=blob:none "$url" "$dir"
            cd "$dir"
            git fetch --depth 1 origin "$rev"
            git checkout --detach FETCH_HEAD
            cd - >/dev/null
          }

          fetch_dep https://github.com/KhronosGroup/SPIRV-Headers.git 465055f6c9128772e20082e893d974146acf7a02 spirv-headers
          fetch_dep https://github.com/KhronosGroup/SPIRV-Tools.git e4bceacf59fdfe742047e94e41ef65a48999a0dd spirv-tools
          fetch_dep https://github.com/KhronosGroup/glslang.git 09c541ee5b22bbac307987b50d86ec2b4f683d75 glslang

      - name: Force 128MB exposed RAM
        run: |
          cd ARMSX2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pcsx2/Memory.cpp')
          s = p.read_text()
          s = s.replace('u32 ExposedRam = MainRam;', 'u32 ExposedRam = TotalRam;')
          s = s.replace('u32 ExposedIopRam = IopRam;', 'u32 ExposedIopRam = TotalIopRam;')
          s = s.replace('static bool s_extra_memory = false;', 'static bool s_extra_memory = true;')
          p.write_text(s)
          print('Forced Ps2MemSize::ExposedRam to TotalRam and ExposedIopRam to TotalIopRam')
          PY
          git diff -- pcsx2/Memory.cpp pcsx2/MemoryTypes.h pcsx2/Memory.h > ../armsx2-128mb.patch
          git diff --check

      - name: Build universal APK
        run: |
          set -euxo pipefail
          cd ARMSX2/platforms/android
          chmod +x gradlew tools/build-universal-page-apk.sh
          ./tools/build-universal-page-apk.sh "$GITHUB_WORKSPACE/ARMSX2-128MB-universal-test.apk" --application-id com.armsx2.extmemtest
          cd "$GITHUB_WORKSPACE"
          sha256sum ARMSX2-128MB-universal-test.apk | tee ARMSX2-128MB-universal-test.sha256

      - name: Collect artifact
        if: always()
        run: |
          mkdir -p artifact
          cp ARMSX2_HEAD.txt artifact/ || true
          cp armsx2-128mb.patch artifact/ || true
          cp ARMSX2-128MB-universal-test.apk artifact/ || true
          cp ARMSX2-128MB-universal-test.sha256 artifact/ || true
          find artifact -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-128MB-universal-test
          path: artifact/
          if-no-files-found: warn
          compression-level: 0
