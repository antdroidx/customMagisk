name: Build ARMSX2 128MB Universal Android APK

on:
  push:
    branches:
      - armsx2-128mb-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3 openjdk-17-jdk

      - name: Prepare Android SDK and debug keystore
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" || true
          fi
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clone ARMSX2
        run: |
          git clone --recursive https://github.com/ARMSX2/ARMSX2.git ARMSX2
          cd ARMSX2
          git rev-parse HEAD | tee ../ARMSX2_HEAD.txt

      - name: Force 128MB exposed RAM
        run: |
          cd ARMSX2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pcsx2/Memory.cpp')
          s = p.read_text()
          s = s.replace('u32 ExposedRam = MainRam;', 'u32 ExposedRam = TotalRam;')
          s = s.replace('u32 ExposedIopRam = IopRam;', 'u32 ExposedIopRam = TotalIopRam;')
          s = s.replace('static bool s_extra_memory = false;', 'static bool s_extra_memory = true;')
          p.write_text(s)
          print('Forced Ps2MemSize::ExposedRam to TotalRam and ExposedIopRam to TotalIopRam')
          PY
          git diff -- pcsx2/Memory.cpp pcsx2/MemoryTypes.h pcsx2/Memory.h > ../armsx2-128mb.patch
          git diff --check

      - name: Build universal APK
        run: |
          set -euxo pipefail
          cd ARMSX2/platforms/android
          chmod +x gradlew tools/build-universal-page-apk.sh
          ./tools/build-universal-page-apk.sh "$GITHUB_WORKSPACE/ARMSX2-128MB-universal-test.apk" --application-id com.armsx2.extmemtest
          cd "$GITHUB_WORKSPACE"
          sha256sum ARMSX2-128MB-universal-test.apk | tee ARMSX2-128MB-universal-test.sha256

      - name: Collect artifact
        if: always()
        run: |
          mkdir -p artifact
          cp ARMSX2_HEAD.txt artifact/ || true
          cp armsx2-128mb.patch artifact/ || true
          cp ARMSX2-128MB-universal-test.apk artifact/ || true
          cp ARMSX2-128MB-universal-test.sha256 artifact/ || true
          find artifact -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-128MB-universal-test
          path: artifact/
          if-no-files-found: warn
          compression-level: 0
